name: Build-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true
      dry-run:
        description: "dry-run: true will never create relase/nuget."
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-release:
    permissions:
      contents: read
    uses: Cysharp/Actions/.github/workflows/validate-release.yaml@main
    with:
      tag: ${{ inputs.tag }}

  update-version:
    needs: [validate-release]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      branch: ${{ steps.version.outputs.branch }}
      is-branch-created: ${{ steps.branch-created.outputs.value }}
    steps:
      - name: Load secrets
        id: op-load-secret
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_PUBLIC }}
          ACTIONBOT_PRIVATE_KEY: "op://${{ vars.OP_VAULT_ACTIONS_PUBLIC }}/GITHUB_ACTIONS_BOT/private key"
          ACTIONBOT_APPID: "op://${{ vars.OP_VAULT_ACTIONS_PUBLIC }}/GITHUB_ACTIONS_BOT/appid"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ steps.op-load-secret.outputs.ACTIONBOT_APPID }}
          private-key: ${{ steps.op-load-secret.outputs.ACTIONBOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: Cysharp/Actions/.github/actions/checkout@main
      - name: Update Cargo version and commit
        id: version
        shell: bash
        run: |
          [[ "$RELEASE_REF_TYPE" == branch ]] || { echo "Run releases from a branch."; exit 1; }
          branch="$RELEASE_BRANCH"
          if [[ "$DRY_RUN" == true ]]; then
            branch="test-release/$TAG-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            git switch -c "$branch"
          fi
          cargo test -p csbindgen update_package_version -- "$VERSION" --nocapture
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add csbindgen/Cargo.toml
          if [[ "$DRY_RUN" == true ]] || ! git diff --cached --quiet; then
            git commit --allow-empty -m "Update Cargo.toml version to $VERSION"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
      - name: Push version commit
        shell: bash
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
      - name: Record temporary branch creation
        id: branch-created
        if: ${{ inputs.dry-run }}
        run: echo "value=true" >> "$GITHUB_OUTPUT"

  build-rust:
    needs: [update-version]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          ref: ${{ needs.update-version.outputs.sha }}
      - run: cargo build --verbose

  build-dotnet:
    needs: [validate-release, update-version]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          ref: ${{ needs.update-version.outputs.sha }}
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
      # Pack NuGet packages with the validated version.
      - run: dotnet build -c Release -p:Version="$VERSION"
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
      - run: dotnet pack -c Release --no-build -p:Version="$VERSION" -p:IncludeSymbols=true -o ./publish
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
      - uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: nuget
          path: ./publish
          retention-days: 7

  create-release:
    needs: [validate-release, update-version, build-rust, build-dotnet]
    permissions:
      contents: write
    uses: Cysharp/Actions/.github/workflows/create-release.yaml@main
    with:
      commit-id: ${{ needs.update-version.outputs.sha }}
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ needs.validate-release.outputs.tag }}
      release-upload: false
    secrets: inherit

  publish-package:
    needs: [validate-release, update-version, create-release]
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
        with:
          ref: ${{ needs.update-version.outputs.sha }}
      - uses: Cysharp/Actions/.github/actions/publish-nuget@main
        with:
          artifact-name: nuget
          user: ${{ secrets.NUGET_USER }}
          version: ${{ needs.validate-release.outputs.version }}
      - uses: Cysharp/Actions/.github/actions/publish-crates@main
        with:
          manifest-path: csbindgen/Cargo.toml
          version: ${{ needs.validate-release.outputs.version }}

  cleanup:
    if: ${{ always() && needs.update-version.outputs.is-branch-created == 'true' }}
    needs: [update-version, create-release, publish-package]
    permissions:
      contents: write
    uses: Cysharp/Actions/.github/workflows/clean-packagejson-branch.yaml@main
    with:
      branch: ${{ needs.update-version.outputs.branch }}
